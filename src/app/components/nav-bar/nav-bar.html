<mat-toolbar color="primary" class="navbar">
  <div class="nav-left">
    <a class="brand" routerLink="/">MyShop</a>
  </div>

  <div class="nav-links">
    <a mat-button href="/home" routerLinkActive="active">Home</a>
    <a mat-button href="/products" routerLinkActive="active">Products</a>
    <a mat-button href="/about" routerLinkActive="active">About</a>
    <a mat-button href="/contact" routerLinkActive="active">Contact</a>
  </div>

  <div class="nav-right">
    <button
      mat-icon-button
      class="mobile-only"
      (click)="toggleMobileMenu()"
    >
      <mat-icon>{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
    <div class="profile-menu desktop-only">
      <button mat-icon-button [matMenuTriggerFor]="menu" (click)="NavBarMenu()">
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>
    <mat-menu #menu="matMenu">
      <a href="{{logInStatus ? '/' : '/login'}}">
        <button mat-menu-item id="logout" (click)="LogOut()">{{this.logInStatus ? 'Logout' : 'Login'}}</button>
      </a>
    </mat-menu>
  </div>

  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <a href="/home" (click)="toggleMobileMenu()">Home</a>
    <a  href="/products" >Products</a>
    <a  href="/about" >About</a>
    <a  href="/contact">Contact</a>
    <a  href="{{this.logInStatus  ? '/' : '/login'}}" >{{this.logInStatus ? 'Logout' : 'Login'}}</a>

  </div>
</mat-toolbar>
